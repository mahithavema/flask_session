<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Registration</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">
</head>
  {% with messages = get_flashed_messages() %}
    {% if messages %}
        <div>
            {% for message in messages %}
                <p>{{ message }}</p>
            {% endfor %}
        </div>
    {% endif %}
{% endwith %}

<body>
  <h1>Expense Tracker</h1>
  <h2>Registration</h2>
  <form method="POST" action="/register">
    <label for="name">Full Name:</label>
    <input type="text" id="name" name="name" maxlength="25" required>
    <br><br>
    <label for="email">Email:</label>
    <input type="email" id="email" name="email" maxlength="30" required>
    <br><br>
    <label for="password">Password:</label>
    <input type="password" id="password" name="password" maxlength="100" required>
    <br><br>
    <label for="phone">Phone Number:</label>
    <input type="text" id="phone" name="phone" maxlength="15" placeholder="+91 9876543210" required>
    <br><br>
    <label for="bank_name">Bank Name:</label>
    <input type="text" id="bank_name" name="bank_name" maxlength="50">
    <br><br>
    <label for="account_no">Account Number:</label>
    <input type="text" id="account_no" name="account_no" maxlength="20">
    <br><br>
    <button type="submit">Register</button>
  </form>

<p style="text-align:center; margin-top:10px;">
    Already have an account? <a href="/login">Login</a>
  </p>
</body>
</html>
