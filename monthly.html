<!DOCTYPE html>
<html>
<head>
    <title>Monthly Totals</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='styles.css') }}">

</head>
<body>
    <h1>Monthly Expense Totals</h1>

    <table border="1">
        <tr>
            <th>Month</th>
            <th>Total Amount</th>
        </tr>

        {% for row in monthly_totals %}
        <tr>
            <td>{{ row[0] }}</td>
            <td>{{ row[1] }}</td>
        </tr>
        {% endfor %}
    </table>

    <br>
    <a href="{{ url_for('index') }}">Back to Home</a>
</body>
</html>
